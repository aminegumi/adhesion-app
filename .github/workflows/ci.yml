name: Java CI with Maven, JaCoCo & SonarCloud

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: adhesion_user
          POSTGRES_PASSWORD: adhesion_pass
          POSTGRES_DB: adhesion_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U adhesion_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # important pour SonarCloud

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build with Maven
        run: mvn clean verify -DskipTests

      - name: Run tests & generate JaCoCo coverage
        run: mvn test jacoco:report

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Analyze with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=aminegumi_adhesion-app \
            -Dsonar.organization=aminegumi \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  e2e-tests:
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: adhesion_user
          POSTGRES_PASSWORD: adhesion_pass
          POSTGRES_DB: adhesion_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U adhesion_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: adhesion-web-angular/package-lock.json

      - name: Install Google Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Start PostgreSQL and wait
        run: |
          sudo systemctl start postgresql
          sleep 10

      - name: Build backend
        run: mvn clean package -DskipTests

      - name: Start backend
        run: |
          java -jar target/*.jar --server.port=8080 &
          echo $! > backend.pid
          sleep 30

      - name: Install frontend dependencies
        working-directory: adhesion-web-angular
        run: npm install

      - name: Build frontend
        working-directory: adhesion-web-angular
        run: npm run build

      - name: Install http-server
        run: npm install -g http-server

      - name: Start frontend
        run: |
          cd adhesion-web-angular/dist/adhesion-web-angular
          http-server -p 4200 &
          echo $! > ../../frontend.pid
          sleep 30

      - name: Run E2E tests
        run: mvn test "-Dtest=SC01_InscriptionPatientE2E,SC02_ConnexionPatientE2E,SC03_ConnexionInvalideE2E,SC04_TestPsychometriqueE2E,SC05_ProfilPredictionE2E,SC06_MarquageDoseE2E,SC07_DashboardAdminE2E,SC08_DeconnexionE2E"

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: |
            target/surefire-reports/
            target/site/jacoco/

      - name: Cleanup processes
        if: always()
        run: |
          if [ -f backend.pid ]; then kill $(cat backend.pid) || true; fi
          if [ -f frontend.pid ]; then kill $(cat frontend.pid) || true; fi
