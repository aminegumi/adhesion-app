spring.application.name=adhesion-app
server.port=8082


# =============================
# DATABASE CONFIG
# =============================
## Resolve datasource URL with precedence:
## 1) SPRING_DATASOURCE_URL (set by docker-compose for in-container networking)
## 2) DB_URL (local .env or IDE environments)
## 3) a local default for IDE runs
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/adhesion_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:adhesion_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:adhesion_pass}}
spring.datasource.driver-class-name=org.postgresql.Driver


# =============================
# JPA / HIBERNATE
# =============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================
# LOGGING
# =============================
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE