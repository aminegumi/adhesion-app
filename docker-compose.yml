services:
  db:
    image: postgres:15
    container_name: adhesion_db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-adhesion_db}
    ports:
      # bind container Postgres to a different host port so local Postgres (if any)
      # doesn't conflict. Host 5433 -> container 5432.
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - adhesion_net

  sonarqube:
    image: sonarqube:latest
    container_name: sonarqube
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - adhesion_net

  adhesion-app:
    build: .
    container_name: adhesion_app
    env_file:
      - .env
    depends_on:
      - db
    # Ensure the app connects to the Postgres service inside the Compose network.
    # Keep credentials in .env (gitignored). We set the datasource URL here so that
    # when running in Docker the app connects to the 'db' service instead of localhost.
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/adhesion_db
    # Map host port 8085 to the application's internal Tomcat port 8082
    ports:
      - "8085:8082"
    networks:
      - adhesion_net

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:

networks:
  adhesion_net:
